[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "turkce-uslup"
version = "0.1.0"
description = "Türkçe metnin üslubu (haber, bilgi, talimat/duyuru, deneme, anlatı, masal, sohbet) ve seslendirme okuma ayarı; yalnız numpy"
readme = "README.md"
license = "MIT AND CC-BY-SA-4.0"
license-files = ["LICENSE"]
authors = [{ name = "Mehmet Veysel Delibaş" }]
requires-python = ">=3.9"
dependencies = ["numpy"]

[project.urls]
Homepage = "https://github.com/seslen-tr/turkce-uslup"
Source = "https://github.com/seslen-tr/turkce-uslup"
Issues = "https://github.com/seslen-tr/turkce-uslup/issues"

[project.optional-dependencies]
bert = ["onnxruntime>=1.16", "tokenizers>=0.15", "huggingface_hub>=0.20"]
egitim = ["scikit-learn", "pyarrow", "huggingface_hub"]

[tool.setuptools.packages.find]
include = ["turkce_uslup*"]

[tool.setuptools.package-data]
turkce_uslup = ["model/uslup.npz"]
